<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@800&amp;display=swap');
      .wordmark { font-family: 'DM Sans', 'Inter', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -1.2px; }
    </style>
  </defs>

  <!-- Luggage tag icon (white on transparent) -->
  <g transform="translate(8, 14)">
    <path d="M 15 0
             L 48 0
             Q 52 0 52 4
             L 52 48
             Q 52 52 48 52
             L 4 52
             Q 0 52 0 48
             L 0 15
             Z"
          fill="#ffffff"/>
    <path d="M 0 15 L 15 0 L 15 15 Z" fill="#cccccc"/>
    <circle cx="11" cy="11" r="3.5" fill="#0f0f23"/>
    <circle cx="11" cy="11" r="1.5" fill="#ffffff"/>
    <path d="M 15 30 L 23 38 L 40 21"
          stroke="#00C9A7" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark (white) -->
  <text x="78" y="56" class="wordmark">
    <tspan fill="#ffffff">Pack</tspan><tspan fill="#00C9A7">Smart</tspan>
  </text>
</svg>
